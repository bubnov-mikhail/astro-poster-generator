name: Import art pack parts
on:
  push:
    paths:
      - "public/art/_pack/.import-url"
  workflow_dispatch:
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and extract pack
        run: |
          set -euo pipefail
          URL=$(tr -d '[:space:]' < public/art/_pack/.import-url)
          echo "Fetching $URL"
          curl -fsSL "$URL" -o /tmp/art-pack.tgz
          mkdir -p /tmp/art-pack-extract
          tar -xzf /tmp/art-pack.tgz -C /tmp/art-pack-extract
          ls -la /tmp/art-pack-extract
          mkdir -p public/art/_pack
          cp /tmp/art-pack-extract/part-*.b64 public/art/_pack/
      - name: Commit each part separately
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 35 69); do
            n=$(printf '%02d' "$i")
            f="public/art/_pack/part-${n}.b64"
            if [ ! -f "$f" ]; then
              echo "missing $f"
              continue
            fi
            # Skip if already full-size on HEAD and identical
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              oldsize=$(git cat-file -s "HEAD:$f")
              newsize=$(wc -c < "$f")
              if [ "$oldsize" = "$newsize" ] && git diff --quiet HEAD -- "$f"; then
                echo "skip identical $f"
                continue
              fi
            fi
            git add "$f"
            git commit -m "Add art pack part ${n}"
            echo "committed $f"
          done
          # remove trigger so re-runs need a new URL push
          if [ -f public/art/_pack/.import-url ]; then
            git rm -f public/art/_pack/.import-url || rm -f public/art/_pack/.import-url
            git add -A public/art/_pack/.import-url 2>/dev/null || true
            git commit -m "Clear art pack import trigger" || true
          fi
          git push origin HEAD:main
